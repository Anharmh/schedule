<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الإجازات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/vacations.css">
</head>
<body>

<div class="wrap">

  <div class="hero">
    <a class="back-link" href="index.html">↩ الرئيسية</a>
    <h1>الإجازات</h1>
  </div>

  <div class="sec-title"><span>اختر المناوبة</span><span class="line"></span></div>
  <div class="group-grid" id="groupGrid"></div>

  <div class="sec-title"><span>تفاصيل الإجازة</span><span class="line"></span></div>
  <div class="panel" id="panel">
    <div class="soon"><div class="big">👆</div>اختر مناوبتك أولًا من الأعلى</div>
  </div>

  <footer>إعداد / أنهار الحمداني</footer>
</div>

<script>
/* ===================== محرك المناوبات (نفس منطق جدول المناوبات) ===================== */
// مناوبة ج ثابتة صباحًا حتى 30/4/1448هـ (2026-10-11) شاملة، ومن 1/5/1448هـ (2026-10-12) تصبح مناوبة ب هي الثابتة صباحًا وج تدخل دورة التبديل مكانها
const EPOCH  = new Date(2026, 9, 6);
const SWITCH = new Date(2026, 9, 12);

// الوقت الحالي بتوقيت السعودية دائمًا، بغض النظر عن منطقة جهاز الزائر
function nowRiyadh(){
  const fmt = new Intl.DateTimeFormat('en-US', {
    timeZone:'Asia/Riyadh', year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false
  });
  const o = {};
  fmt.formatToParts(new Date()).forEach(p=>{ if(p.type!=='literal') o[p.type]=p.value; });
  return new Date(+o.year, +o.month-1, +o.day, (+o.hour)%24, +o.minute, +o.second);
}

const PHASE_COLOR = {
  'ظهر':  {c:'var(--c-day)',   bg:'var(--c-day-bg)'},
  'ليل':  {c:'var(--c-night)', bg:'var(--c-night-bg)'},
  'أوف':  {c:'var(--c-off)',   bg:'var(--c-off-bg)'},
  'صباح': {c:'var(--c-morn)',  bg:'var(--c-morn-bg)'}
};

function stripTime(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function diffDays(d){ return Math.round((stripTime(d) - EPOCH) / 86400000); }
function mod9(n){ return ((n % 9) + 9) % 9; }

function phaseFromPos(p){
  if(p < 3) return {phase:'ظهر', day:p+1};
  if(p < 6) return {phase:'ليل', day:p-3+1};
  return {phase:'أوف', day:p-6+1};
}

function getDaySchedule(date){
  const d = stripTime(date);
  const dd = diffDays(d);
  const afterSwitch = d.getTime() >= SWITCH.getTime();
  const slot2Group = afterSwitch ? 'ج' : 'ب';
  const fixedGroup = afterSwitch ? 'ب' : 'ج';

  const a    = phaseFromPos(mod9(dd + 0));
  const s2   = phaseFromPos(mod9(dd + 3));
  const offd = phaseFromPos(mod9(dd + 6));

  const result = {};
  result['أ'] = a;
  result[slot2Group] = s2;
  result[fixedGroup] = {phase:'صباح', day:null, fixed:true};
  result['د'] = offd;
  return result;
}

function addDays(date, n){ const d=stripTime(date); return new Date(d.getFullYear(), d.getMonth(), d.getDate()+n); }

function findOhrStarts(group, fromDate, count, limitDate){
  const results = [];
  let d = stripTime(fromDate);
  let guard = 0;
  while(results.length < count && guard < 500){
    if(limitDate && d.getTime() > limitDate.getTime()) break;
    const info = getDaySchedule(d)[group];
    if(!info.fixed && info.phase === 'ظهر' && info.day === 1) results.push(new Date(d));
    d = addDays(d, 1);
    guard++;
  }
  return results;
}

// مناوبة ب تتوقف عن دورة الظهر/الليل عند بدء الدوام الصباحي الثابت (SWITCH)
// مناوبة ج تبدأ دورة الظهر/الليل من بداية الدوام الصباحي الثابت الجديد (SWITCH)
const GROUP_BOUNDS = {
  'أ': {min:null, max:null},
  'د': {min:null, max:null},
  'ب': {min:null, max:addDays(SWITCH,-1)},
  'ج': {min:SWITCH, max:null}
};

const HIJRI_LOCALE = 'ar-SA-u-ca-islamic-umalqura-nu-latn';
function hijriShort(date){
  try{ return new Intl.DateTimeFormat(HIJRI_LOCALE, {day:'numeric', month:'short'}).format(date); }
  catch(e){ return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-nu-latn', {day:'numeric', month:'short'}).format(date); }
}
function hijriFull(date){
  try{ return new Intl.DateTimeFormat(HIJRI_LOCALE, {day:'numeric', month:'long', year:'numeric'}).format(date); }
  catch(e){ return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-nu-latn', {day:'numeric', month:'long', year:'numeric'}).format(date); }
}

const HIJRI_MONTHS = ['محرم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];

function hijriParts(date){
  try{
    var fmt = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', {year:'numeric', month:'numeric', day:'numeric'});
  }catch(e){
    fmt = new Intl.DateTimeFormat('en-u-ca-islamic', {year:'numeric', month:'numeric', day:'numeric'});
  }
  const o = {};
  fmt.formatToParts(date).forEach(p=>o[p.type]=p.value);
  return {y:+o.year, m:+o.month, d:+o.day};
}

function jsDayToArabicCol(jsDay){ return jsDay; }

function hijriMonthBounds(anchor){
  let d = stripTime(anchor);
  let p = hijriParts(d);
  let guard = 0;
  while(p.d !== 1 && guard < 40){ d = addDays(d, -1); p = hijriParts(d); guard++; }
  const first = d, y = p.y, m = p.m;

  let d2 = addDays(first, 1);
  let p2 = hijriParts(d2);
  guard = 0;
  while(p2.y === y && p2.m === m && guard < 40){ d2 = addDays(d2, 1); p2 = hijriParts(d2); guard++; }
  const last = addDays(d2, -1);
  return {first, last};
}

// يقدّر تاريخًا ميلاديًا يقع داخل شهر/سنة هجريين معينين (لقفز التقويم المصغر)
function hijriMonthToAnchor(y, m){
  const refH = hijriParts(EPOCH);
  let guess = addDays(EPOCH, Math.round(((y - refH.y) * 12 + (m - refH.m)) * 29.5306));
  let b = hijriMonthBounds(guess);
  let bh = hijriParts(b.first);
  let guard = 0;
  while((bh.y !== y || bh.m !== m) && guard < 8){
    guess = addDays(guess, ((y - bh.y) * 12 + (m - bh.m)) * 29.5306);
    b = hijriMonthBounds(guess);
    bh = hijriParts(b.first);
    guard++;
  }
  return b.first;
}

/* ===================== الحالة ===================== */
const today = nowRiyadh();
const todaySch = getDaySchedule(today);
let selectedGroup = null;
let selectedStart = null;

function isFixedToday(g){ return !!todaySch[g].fixed; }

let curEffMin = null, curEffMax = null;
let calAnchor = null;

/* ===================== اختيار المناوبة ===================== */
function renderGroupGrid(){
  const grid = document.getElementById('groupGrid');
  grid.innerHTML = '';
  ['أ','ب','ج','د'].forEach(g=>{
    const card = document.createElement('div');
    card.className = 'group-card' + (selectedGroup===g ? ' sel' : '');
    card.innerHTML = `
      <div class="letter">${g}</div>
      <div class="tag">${isFixedToday(g) ? 'صباح ثابت' : ''}</div>
    `;
    card.addEventListener('click', ()=>{
      selectedGroup = g;
      selectedStart = null;
      calAnchor = null;
      renderGroupGrid();
      renderPanel();
    });
    grid.appendChild(card);
  });
}

/* ===================== اللوحة الرئيسية ===================== */
function renderPanel(){
  const panel = document.getElementById('panel');

  if(selectedGroup === null){
    panel.innerHTML = `<div class="soon"><div class="big">👆</div>اختر مناوبتك أولًا من الأعلى</div>`;
    return;
  }

  const bounds = GROUP_BOUNDS[selectedGroup];
  const minBound = bounds.min;
  const maxBound = bounds.max;
  const effMin = (minBound && minBound.getTime() > today.getTime()) ? minBound : today;
  const effMax = maxBound;
  const windowClosed = effMax && effMin.getTime() > effMax.getTime();
  curEffMin = effMin;
  curEffMax = effMax;

  if(windowClosed){
    panel.innerHTML = `<div class="soon"><div class="big">🚫</div>
      لا تتوفر تواريخ إجازة متاحة لمناوبة ${selectedGroup} حاليًا<br>
      <span style="font-size:11.5px;">توقفت دورة الظهر/الليل عند بدء الدوام الصباحي الثابت (${hijriFull(addDays(maxBound,1))})</span>
    </div>`;
    return;
  }

  let banner = '';
  if(minBound && minBound.getTime() > today.getTime()){
    banner = `<div class="soon" style="padding:16px 10px;"><div class="big">🚧</div>قريبًا</div>`;
  }

  const suggestions = findOhrStarts(selectedGroup, effMin, 2, effMax);
  if(selectedStart === null) selectedStart = toKey(suggestions[0] || effMin);

  let sugHtml = suggestions.length
    ? suggestions.map(d=>{
        const key = toKey(d);
        return `<div class="sug-chip" data-key="${key}">
          <b>${d.toLocaleDateString('ar-SA-u-nu-latn',{weekday:'short', day:'numeric', month:'long'})}</b>
          <span>${hijriShort(d)} هـ</span>
        </div>`;
      }).join('')
    : `<div class="result-hint">لا توجد تواريخ "أول ظهر" قريبة ضمن المدى المتاح</div>`;

  panel.innerHTML = banner + `
    <label>عدد أيام الإجازة</label>
    <input type="number" id="daysInput" min="1" placeholder="مثال: 7">

    <label style="margin-top:14px;">تاريخ بداية الإجازة (هجري)</label>
    <button type="button" class="date-toggle" id="dateToggle">
      <span id="dateToggleText"></span><span class="arrow">▾</span>
    </button>
    <div class="mini-cal-pop" id="miniCalPop" style="display:none;">
      <div class="mini-jump" id="miniJumpBar"></div>
      <div class="mini-cal" id="miniCal"></div>
    </div>

    <button class="search-btn" id="searchBtn">🔍 بحث</button>

    <button type="button" class="sug-toggle" id="sugToggle">💡 عرض الاقتراحات</button>
    <div class="sug-wrap" id="sugWrap" style="display:none;">
      <span class="sug-label">أقرب ظهرين:</span>
      <div class="sug-list">${sugHtml}</div>
    </div>

    <div class="result" id="resultBox"><div class="result-hint">اختر عدد الأيام وتاريخ البداية ثم اضغط بحث</div></div>
  `;

  updateDateToggleText();
  renderMiniCal();

  document.getElementById('dateToggle').addEventListener('click', ()=>{
    const pop = document.getElementById('miniCalPop');
    const btn = document.getElementById('dateToggle');
    const open = pop.style.display !== 'none';
    pop.style.display = open ? 'none' : 'block';
    btn.classList.toggle('open', !open);
  });
  document.getElementById('sugToggle').addEventListener('click', ()=>{
    const wrap = document.getElementById('sugWrap');
    const open = wrap.style.display !== 'none';
    wrap.style.display = open ? 'none' : 'block';
    document.getElementById('sugToggle').textContent = open ? '💡 عرض الاقتراحات' : '💡 إخفاء الاقتراحات';
  });
  document.querySelectorAll('.sug-chip').forEach(el=>{
    el.addEventListener('click', ()=>{
      selectedStart = el.dataset.key;
      calAnchor = fromKey(selectedStart);
      updateDateToggleText();
      renderMiniCal();
    });
  });
  document.getElementById('searchBtn').addEventListener('click', renderResult);
}

function updateDateToggleText(){
  const el = document.getElementById('dateToggleText');
  if(el) el.textContent = '📅 ' + hijriFull(fromKey(selectedStart));
}

/* ===================== تقويم هجري مصغر لاختيار تاريخ البداية ===================== */
const MINI_WEEK = ['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];

function renderMiniCal(){
  if(!calAnchor) calAnchor = fromKey(selectedStart);
  const b = hijriMonthBounds(calAnchor);
  const daysInMonth = Math.round((b.last - b.first) / 86400000) + 1;
  const firstH = hijriParts(b.first);
  const label = `${HIJRI_MONTHS[firstH.m - 1]} ${firstH.y}`;
  const startCol = jsDayToArabicCol(b.first.getDay());
  const todayKey = toKey(today);

  let cells = '';
  for(let i=0;i<startCol;i++) cells += `<div class="mini-day empty"></div>`;
  for(let i=0;i<daysInMonth;i++){
    const date = addDays(b.first, i);
    const key = toKey(date);
    const disabled = date.getTime() < curEffMin.getTime() || (curEffMax && date.getTime() > curEffMax.getTime());
    let cls = 'mini-day';
    if(disabled) cls += ' disabled';
    if(key === todayKey) cls += ' today';
    if(key === selectedStart) cls += ' selected';
    cells += `<div class="${cls}" data-key="${key}">${i+1}</div>`;
  }

  let monthOpts = '';
  HIJRI_MONTHS.forEach((name,i)=>{
    monthOpts += `<option value="${i+1}"${(i+1)===firstH.m?' selected':''}>${name}</option>`;
  });

  document.getElementById('miniJumpBar').innerHTML = `
    <select id="miniJumpMonth">${monthOpts}</select>
    <input type="number" id="miniJumpYear" min="1400" max="1500" value="${firstH.y}">
    <button type="button" id="miniJumpBtn">🔍</button>
  `;

  const cal = document.getElementById('miniCal');
  cal.innerHTML = `
    <div class="mini-cal-nav">
      <button type="button" id="miniPrev">‹</button>
      <span class="label">${label}</span>
      <button type="button" id="miniNext">›</button>
    </div>
    <div class="mini-week-row">${MINI_WEEK.map(x=>`<div>${x}</div>`).join('')}</div>
    <div class="mini-days-grid">${cells}</div>
    <div class="mini-cal-actions">
      <button type="button" class="cancel" id="miniCancel">إلغاء</button>
      <button type="button" class="today-btn" id="miniToday">اليوم</button>
    </div>
  `;

  document.getElementById('miniJumpBtn').addEventListener('click', ()=>{
    const jm = parseInt(document.getElementById('miniJumpMonth').value, 10);
    const jy = parseInt(document.getElementById('miniJumpYear').value, 10);
    if(!jm || !jy) return;
    calAnchor = hijriMonthToAnchor(jy, jm);
    renderMiniCal();
  });
  document.getElementById('miniCancel').addEventListener('click', ()=>{
    const pop = document.getElementById('miniCalPop');
    const btn = document.getElementById('dateToggle');
    pop.style.display = 'none';
    btn.classList.remove('open');
  });
  document.getElementById('miniToday').addEventListener('click', ()=>{
    const t = stripTime(today);
    const disabled = t.getTime() < curEffMin.getTime() || (curEffMax && t.getTime() > curEffMax.getTime());
    if(!disabled){
      selectedStart = toKey(t);
      updateDateToggleText();
    }
    calAnchor = t;
    renderMiniCal();
  });
  document.getElementById('miniPrev').addEventListener('click', ()=>{
    calAnchor = addDays(b.first, -1);
    renderMiniCal();
  });
  document.getElementById('miniNext').addEventListener('click', ()=>{
    calAnchor = addDays(b.last, 1);
    renderMiniCal();
  });
  cal.querySelectorAll('.mini-day:not(.empty):not(.disabled)').forEach(el=>{
    el.addEventListener('click', ()=>{
      selectedStart = el.dataset.key;
      calAnchor = fromKey(selectedStart);
      updateDateToggleText();
      renderMiniCal();
      const pop = document.getElementById('miniCalPop');
      const btn = document.getElementById('dateToggle');
      if(pop){ pop.style.display = 'none'; btn.classList.remove('open'); }
    });
  });
}

function toKey(d){ return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }
function fromKey(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m,d); }

const ORDINAL = {1:'الأول', 2:'الثاني', 3:'الثالث'};

function renderResult(){
  const rawDays = document.getElementById('daysInput').value;
  const box = document.getElementById('resultBox');
  if(!rawDays || parseInt(rawDays,10) < 1){
    box.innerHTML = `<div class="result-hint">⚠️ أدخل عدد أيام الإجازة أولًا</div>`;
    return;
  }
  const days = parseInt(rawDays, 10);
  const start = fromKey(selectedStart);

  if(start.getTime() < curEffMin.getTime() || (curEffMax && start.getTime() > curEffMax.getTime())){
    box.innerHTML = `<div class="result-hint">⚠️ هذا التاريخ خارج المدى المتاح لمناوبة ${selectedGroup}</div>`;
    return;
  }

  const end = addDays(start, days - 1);

  function phaseTag(date){
    const info = getDaySchedule(date)[selectedGroup];
    return info.fixed ? 'صباح ثابت' : `${info.phase} — اليوم ${ORDINAL[info.day]}`;
  }
  const startColors = PHASE_COLOR[getDaySchedule(start)[selectedGroup].fixed ? 'صباح' : getDaySchedule(start)[selectedGroup].phase];
  const endColors = PHASE_COLOR[getDaySchedule(end)[selectedGroup].fixed ? 'صباح' : getDaySchedule(end)[selectedGroup].phase];

  box.innerHTML = `
    <div class="row">
      <div>
        <span class="k">تاريخ البداية</span>
        <span class="tagpill" style="background:${startColors.bg};color:${startColors.c}">${phaseTag(start)}</span>
      </div>
      <span class="v">${start.toLocaleDateString('ar-SA-u-nu-latn',{day:'numeric',month:'long',year:'numeric'})}<small>${hijriShort(start)} هـ</small></span>
    </div>
    <div class="row">
      <div>
        <span class="k">تاريخ النهاية</span>
        <span class="tagpill" style="background:${endColors.bg};color:${endColors.c}">${phaseTag(end)}</span>
      </div>
      <span class="v">${end.toLocaleDateString('ar-SA-u-nu-latn',{day:'numeric',month:'long',year:'numeric'})}<small>${hijriShort(end)} هـ · ${days} ${days===1?'يوم':'أيام'} إجازة</small></span>
    </div>
  `;
}

/* ===================== تشغيل ===================== */
renderGroupGrid();
renderPanel();
</script>

</body>
</html>
